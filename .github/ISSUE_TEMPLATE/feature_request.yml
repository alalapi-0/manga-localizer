name: Feature request
description: Propose a focused product or provider improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the production workflow problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      options: [Import, Detection, OCR, Reading order, Translation, Inpainting, Typesetting, Review, Export, Other]
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Offline, privacy, licensing, or dependency impact
