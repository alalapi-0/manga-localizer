name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/manga-localizer-backend-venv
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install OCR system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert
      - run: uv sync --project backend --group dev --locked
      - run: uv run --project backend ruff check backend scripts/audit_release.py
      - run: uv run --project backend ruff format --check backend scripts/audit_release.py
      - run: uv run --project backend pytest backend/tests
      - run: uv run --project backend python scripts/audit_release.py

  frontend:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MANGA_LOCALIZER_CI_LOCAL_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run check:launcher
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test -- --run
      - run: npm --prefix frontend run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CI: "true"
      MANGA_LOCALIZER_CI_LOCAL_RUNTIME: "1"
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/manga-localizer-backend-venv
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install system and project dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert
          uv sync --project backend --group dev --locked
          npm ci
          npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
